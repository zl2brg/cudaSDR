name: Linux packages (AppImage + deb)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  appimage:
    name: Build AppImage and .deb (Ubuntu 24.04 container)
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # HTTPS URL is in .gitmodules. Use GH_PAT if freedv-backend is private.
          submodules: recursive
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI image (cached Qt 6.12 layer)
        uses: docker/build-push-action@v6
        with:
          context: packaging
          file: packaging/Dockerfile
          push: false
          load: true
          tags: cudasdr-ci:24.04
          cache-from: type=gha,scope=cudasdr-ci-24.04
          cache-to: type=gha,mode=max,scope=cudasdr-ci-24.04

      - name: Build AppImage and .deb in container
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          mkdir -p out
          test -f deps/freedv-backend/CMakeLists.txt
          docker run --rm \
            -e JOBS="$(nproc)" \
            -e BUILD_DIR=build-ci \
            -e OUTPUT_DIR=/out \
            -e APPIMAGE_EXTRACT_AND_RUN=1 \
            -e BUILD_DEB=1 \
            -e GH_TOKEN \
            -e GITHUB_TOKEN \
            -v "$PWD:/src:rw" \
            -v "$PWD/out:/out:rw" \
            -w /src \
            cudasdr-ci:24.04 \
            ./scripts/ci_appimage.sh
          ls -lh out/*.AppImage out/*.deb

      - name: Smoke-test .deb in a clean Ubuntu 24.04 container
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/out:/out:ro" ubuntu:24.04 bash -c '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq /out/*.deb >/dev/null
            missing="$(ldd /opt/cudasdr/bin/cudasdr | grep "not found" || true)"
            if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
            for p in /opt/cudasdr/plugins/platforms/*.so; do
              if ldd "$p" | grep "not found"; then exit 1; fi
            done
            dpkg -s cudasdr | sed -n "/^Version/p;/^Depends/p"
          '

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: cudasdr-appimage-x86_64
          path: out/*.AppImage
          if-no-files-found: error

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: cudasdr-deb-amd64
          path: out/*.deb
          if-no-files-found: error

      - name: Attach packages to GitHub Release
        # Keep this from failing the job: the artifacts are already uploaded.
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Pushing a tag does not create a Release; create one if needed.
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" out/*.AppImage out/*.deb --clobber
          echo "Attached AppImage and .deb to release ${GITHUB_REF_NAME}"
