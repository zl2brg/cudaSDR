name: Build AppImage

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            qt6-base-dev \
            qt6-multimedia-dev \
            qt6-opengl-dev \
            qt6-websockets-dev \
            libpulse-dev \
            libfftw3-dev \
            libusb-1.0-0-dev \
            python3-pil

      - name: Build and package AppImage
        run: |
          chmod +x ./scripts/make_appimage.sh
          ./scripts/make_appimage.sh --build

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: cudaSDR-*-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
