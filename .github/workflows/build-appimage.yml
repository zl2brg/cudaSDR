name: Build AppImage

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libqt5gui5 \
            libqt5core5a \
            qt5-qmake \
            qtbase5-dev \
            libpulse-dev \
            libfftw3-dev \
            libusb-1.0-0-dev \
            appimage-builder

      - name: Build project
        run: |
          mkdir build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Create AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          
          # Copy built binaries and libraries
          cp build/cudaSDR AppDir/usr/bin/ || true
          find build -name "*.so*" -exec cp {} AppDir/usr/lib/ \;
          
          # Download and run appimagetool
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          ./appimagetool-x86_64.AppImage AppDir cudaSDR-${{ github.ref_name }}-x86_64.AppImage

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: cudaSDR-${{ github.ref_name }}-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
