name: Build AppImage

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Allow AppImages (linuxdeploy, appimage-builder tool) to run inside the
      # GitHub Actions AppArmor sandbox without requiring FUSE kernel support.
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            qt6-base-dev \
            qt6-multimedia-dev \
            qt6-opengl-dev \
            qt6-websockets-dev \
            libpulse-dev \
            libfftw3-dev \
            libusb-1.0-0-dev \
            python3-pil \
            libfuse2 \
            elfutils \
            patchelf \
            squashfs-tools
          pip install appimage-builder

      - name: Build project
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)
          DESTDIR="$PWD/AppDir" cmake --install build

      - name: Create AppImage
        run: |
          appimage-builder --recipe packaging/AppImageBuilder.yml --skip-tests

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: cudaSDR-*-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
