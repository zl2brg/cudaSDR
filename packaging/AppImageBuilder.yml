version: 1

# ---------------------------------------------------------------------------
# appimage-builder recipe for cudaSDR
#
# The cmake build + install into AppDir is performed by the CI workflow
# (build-appimage.yml) before this recipe is invoked.  The `script` section
# below is therefore a no-op placeholder; appimage-builder only needs to
# bundle the runtime dependencies declared in `AppDir.apt.include`.
#
# Run locally (after cmake --install AppDir):
#   APPIMAGE_EXTRACT_AND_RUN=1 appimage-builder --recipe packaging/AppImageBuilder.yml --skip-tests
# ---------------------------------------------------------------------------

AppDir:
  path: ./AppDir

  app_info:
    id: cudasdr
    name: cudaSDR
    icon: cudasdr
    # Pass VERSION env var to override; defaults to "latest" if unset.
    version: !ENV '${VERSION:-latest}'
    exec: usr/bin/cudasdr
    exec_args: $@

  # -------------------------------------------------------------------------
  # Runtime dependencies to bundle from the build host's apt.
  # These cover the Qt6 runtime, audio, FFT, USB, and graphics stack that
  # cudaSDR needs but that may not be present on end-user systems.
  # -------------------------------------------------------------------------
  apt:
    arch: amd64
    sources:
      - sourceline: >-
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu/
          noble main restricted universe multiverse
        key_url: >-
          http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x3b4fe6acc0b21f32&options=mr&exact=on

    include:
      # --- C++ / glibc runtime ---
      - libc6
      - libstdc++6
      - libgcc-s1

      # --- Qt 6 runtime (Ubuntu 24.04 / Noble package names) ---
      - libqt6core6t64
      - libqt6gui6t64
      - libqt6widgets6t64
      - libqt6network6t64
      - libqt6opengl6t64
      - libqt6openglwidgets6t64
      - libqt6websockets6t64
      - libqt6multimedia6t64
      - libqt6multimediaquick6t64
      - qt6-qpa-plugins
      - libqt6dbus6t64
      - libqt6xml6t64

      # --- Audio ---
      - libpulse0
      - libasound2t64

      # --- FFT ---
      - libfftw3-single3
      - libfftw3-double3

      # --- USB ---
      - libusb-1.0-0

      # --- OpenGL / graphics ---
      - libgl1
      - libglx0
      - libglvnd0
      - libx11-6
      - libxcb1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libfontconfig1
      - libfreetype6

    exclude:
      # Strip bloat that is not needed at runtime.
      - dpkg

  files:
    exclude:
      - usr/share/man
      - usr/share/doc
      - usr/lib/x86_64-linux-gnu/gconv

  runtime:
    env:
      # Let Qt find its bundled plugins inside the AppDir.
      QT_PLUGIN_PATH: '$APPDIR/usr/lib/x86_64-linux-gnu/qt6/plugins'
      QT_QPA_PLATFORM_PLUGIN_PATH: '$APPDIR/usr/lib/x86_64-linux-gnu/qt6/plugins/platforms'
      # Ensure bundled libs are found before system ones.
      LD_LIBRARY_PATH: '$APPDIR/usr/lib:$APPDIR/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH'

AppImage:
  arch: x86_64
  # No delta-update info needed for a simple tag-based release.
  update-information: None
  sign-key: None
